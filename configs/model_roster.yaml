schema_version: 2
roster_id: ptl_formal_predictor_roster_v2
description: >-
  Compact predictor roster for the context-v2 benchmark. Each predictor emits
  a post-perturbation prediction plus a declared predictor-level uncertainty
  estimate; PTL consumes the resulting
  prediction-level table without using environment or predictor IDs as its
  headline features.
uq_policy:
  native_uq_preferred: true
  split_id: ptl_biological_instance_split_v1
  split_seed: 20260907
  model_seeds: [0, 1, 2]
  fallback_when_native_uq_unavailable: three_seed_ensemble_disagreement
  evaluation_gene_space: ptl_context_v2_intersection
predictors:
  - predictor_id: mean_matching
    family: simple_baseline
    role: comparator
    implementation: local_signature_mean
    status: available_on_processed_surfaces
    supported_environment_policy: all_formal_environments
    uncertainty_source: training_bootstrap_disagreement
  - predictor_id: strong_linear
    family: linear
    role: formal_roster
    implementation: ahlmann_eltze_bilinear_ridge
    status: available_with_formal_execution_and_oracle_audit
    supported_environment_policy: all_formal_environments
    uncertainty_source: training_bootstrap_disagreement
  - predictor_id: slim_string
    family: string_embedding_bilinear
    role: formal_roster
    implementation: published_slim_string_bilinear_ridge
    status: available_with_local_public_embedding
    supported_environment_policy: all_formal_environments
    uncertainty_source: training_bootstrap_disagreement
  - predictor_id: official_gears
    family: graph_neural_network
    role: formal_roster
    implementation: official_gears_systema_compatible_adapter
    status: formal_external_contract_executed_remote_cuda_test_only
    supported_environment_policy: predictor_supported_cells_only
    uncertainty_source: native_log_variance_when_available_else_ensemble
  - predictor_id: cpa
    family: latent_compositional
    role: formal_roster
    implementation: systema_cpa_entrypoint
    status: execution_pending
    supported_environment_policy: predictor_supported_cells_only
    uncertainty_source: three_seed_ensemble_disagreement
  - predictor_id: scgpt
    family: foundation_style
    role: formal_roster
    implementation: systema_scgpt_entrypoint
    status: execution_pending
    supported_environment_policy: predictor_supported_cells_only
    uncertainty_source: three_seed_ensemble_disagreement
  - predictor_id: prescribe
    family: uncertainty_aware_predictor
    role: optional_comparator
    implementation: upstream_compatible_entrypoint
    status: optional_non_blocking
    supported_environment_policy: compatible_overlap_cells_only
    uncertainty_source: native_uncertainty
